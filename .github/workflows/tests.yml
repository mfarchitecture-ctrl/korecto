name: Tests

# Informatif : les 304 contrôles locaux (sans réseau ni vrai mail) à chaque envoi sur main.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lancer les tests
        shell: pwsh
        run: ./src/tests/LANCER_TESTS.ps1
      - name: Rapport
        if: always()
        shell: pwsh
        run: |
          if (Test-Path src/tests/RESULTATS.txt) {
            Get-Content src/tests/RESULTATS.txt -Encoding UTF8 | Select-Object -First 4
            Get-Content src/tests/RESULTATS.txt -Encoding UTF8 | Select-String -Pattern '^FAIL'
          } else {
            'Aucun rapport : les 8 dernières lignes du journal de progression suivent.'
            Get-Content src/tests/PROGRES.txt -Encoding UTF8 | Select-Object -Last 8
          }
